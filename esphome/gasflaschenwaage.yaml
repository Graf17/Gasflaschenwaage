substitutions:
  device_name: gasflaschenwaage
  friendly_name: Gasflaschenwaage

  # Low-power Zyklus
  awake_max_duration: 5min
  sleep_duration: 10min
  debug_keep_awake: "false"

  # HX711-Pins
  hx711_dout_pin: "16"
  hx711_sck_pin: "17"

  # Gewichtsparameter
  bottle_empty_kg: "6.6"
  gas_nominal_kg: "5.0"

  # Akkuparameter (MAX17043 ueber I2C)
  i2c_sda_pin: GPIO19
  i2c_scl_pin: GPIO18
  battery_low_pct: "15.0"
  battery_critical_pct: "8.0"

  # Kalibrierpunkte fuer den HX711
  calib_raw_no_load: "0.0"
  calib_kg_no_load: "0.0"
  calib_raw_known: "22005.666"
  calib_kg_known: "1.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  on_boot:
    priority: 1000
    then:
      # Release any previous GPIO hold that might persist from deep sleep
      - lambda: |-
          #include "driver/gpio.h"
          gpio_num_t sck_pin = (gpio_num_t)${hx711_sck_pin};
          gpio_hold_dis(sck_pin);
          gpio_num_t i2c_power_pin = GPIO_NUM_20;
          gpio_set_direction(i2c_power_pin, GPIO_MODE_OUTPUT);
          gpio_set_level(i2c_power_pin, 1);
      - if:
          condition:
            lambda: 'return ${debug_keep_awake};'
          then:
            - deep_sleep.prevent: deep_sleep_control
            - logger.log:
                level: WARN
                format: "Debug-Modus: Deep Sleep ist deaktiviert"
      # Give the I2C rail time to come up before reading the fuel gauge
      - delay: 3s
      # Trigger battery gauge read before starting the publish script
      - component.update: battery_gauge
      - delay: 500ms
      - script.execute: publish_after_zigbee_join

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

globals:
  - id: battery_voltage_valid
    type: bool
    restore_value: no
    initial_value: "false"
  - id: battery_pct_valid
    type: bool
    restore_value: no
    initial_value: "false"
  - id: battery_cache_v
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: battery_cache_pct
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: scale_ready
    type: bool
    restore_value: no
    initial_value: "false"

logger:
  baud_rate: 115200
  level: DEBUG

i2c:
  id: i2c_bus_main
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  frequency: 100kHz
  scan: true

zigbee:
  id: zigbee_radio
  model: ${friendly_name}
  router: false
  power_source: BATTERY
  on_join:
    then:
      - logger.log:
          format: "Zigbee beigetreten (factory_new=%s)"
          args: ['x ? "true" : "false"']

deep_sleep:
  id: deep_sleep_control
  run_duration: ${awake_max_duration}
  sleep_duration: ${sleep_duration}

script:
  - id: publish_after_zigbee_join
    mode: single
    then:
      - wait_until:
          condition:
            lambda: 'return id(zigbee_radio).is_joined();'
          timeout: 2min
      - if:
          condition:
            lambda: 'return id(zigbee_radio).is_joined();'
          then:
            - script.execute: publish_then_sleep
          else:
            - logger.log:
                level: WARN
                format: "Zigbee-Join-Timeout: Messwerte werden erneut versucht"

  - id: publish_then_sleep
    mode: restart
    then:
      # kurze Wartezeit, damit Komponenten initialisiert sind
      - delay: 500ms

      # Reset readiness flag
      - lambda: |-
          id(scale_ready) = false;

      # 1) Trigger HX711 Messungen (HX711 setzt scale_ready in on_value)
      - logger.log: "Trigger HX711 read..."
      - component.update: scale_total_kg_raw

      # 2) Warten bis HX711 ein gültiges, gefiltertes Ergebnis geliefert hat
      - wait_until:
          condition:
            lambda: 'return id(scale_ready);'
          timeout: 10s

      # 3) Gewichtswerte nur mit bestaetigter HX711-Messung publizieren
      - if:
          condition:
            lambda: 'return id(scale_ready);'
          then:
            - logger.log: "HX711 ready, aktualisiere Gewichtssensoren..."
            - sensor.template.publish:
                id: scale_total_kg
                state: !lambda |-
                  return id(scale_total_kg_raw).state;
            - sensor.template.publish:
                id: gas_weight_kg
                state: !lambda |-
                  const float empty_kg = ${bottle_empty_kg}f;
                  return std::max(id(scale_total_kg_raw).state - empty_kg, 0.0f);
            - sensor.template.publish:
                id: gas_fill_pct
                state: !lambda |-
                  const float empty_kg = ${bottle_empty_kg}f;
                  const float nominal_kg = ${gas_nominal_kg}f;
                  const float gas_kg = std::max(id(scale_total_kg_raw).state - empty_kg, 0.0f);
                  return std::clamp((gas_kg / nominal_kg) * 100.0f, 0.0f, 100.0f);
            - logger.log:
                format: "Gas: %.2f kg, %.1f %%"
                args:
                  - "std::max(id(scale_total_kg_raw).state - ${bottle_empty_kg}f, 0.0f)"
                  - "std::clamp((std::max(id(scale_total_kg_raw).state - ${bottle_empty_kg}f, 0.0f) / ${gas_nominal_kg}f) * 100.0f, 0.0f, 100.0f)"
          else:
            - logger.log:
                level: WARN
                format: "HX711-Timeout: Gewichtswerte werden in diesem Zyklus nicht publiziert"

      # 4) Sicherstellen, dass Battery Gauge aktuell ist
      - component.update: battery_gauge
      - delay: 800ms
      - if:
          condition:
            lambda: 'return id(battery_voltage_valid) && id(battery_pct_valid);'
          then:
            - sensor.template.publish:
                id: battery_voltage
                state: !lambda |-
                  return id(battery_cache_v);
            - sensor.template.publish:
                id: battery_pct
                state: !lambda |-
                  return id(battery_cache_pct);
            - logger.log:
                format: "Batterie: %.2f V, %.1f %%"
                args: ["id(battery_cache_v)", "id(battery_cache_pct)"]
          else:
            - logger.log:
                level: WARN
                format: "MAX17043 lieferte keine vollstaendigen Akkuwerte"

      # 5) Wartezeit, damit Zigbee TX-Queue die Frames senden kann
      - logger.log: "Warte auf Zigbee TX (5s)..."
      - delay: 5000ms


      - if:
          condition:
            lambda: 'return !${debug_keep_awake};'
          then:
            # HX711 in Power-Down und Pin-Hold setzen (Deep Sleep safe)
            - logger.log: "Zwinge HX711 in Power-Down und aktiviere Pin-Hold..."
            - lambda: |-
                #include "driver/gpio.h"
                gpio_num_t sck_pin = (gpio_num_t)${hx711_sck_pin};
                gpio_set_direction(sck_pin, GPIO_MODE_OUTPUT);
                gpio_set_level(sck_pin, 1);
                gpio_hold_en(sck_pin);
            # I2C abschalten und schlafen
            - lambda: |-
                #include "driver/gpio.h"
                gpio_set_level(GPIO_NUM_20, 0);
            - delay: 100ms
            - deep_sleep.enter: deep_sleep_control

sensor:
  - platform: hx711
    id: scale_total_kg_raw
    internal: true
    dout_pin: GPIO${hx711_dout_pin}
    clk_pin: GPIO${hx711_sck_pin}
    gain: 128
    update_interval: 1s
    filters:
      - calibrate_linear:
          - ${calib_raw_no_load} -> ${calib_kg_no_load}
          - ${calib_raw_known} -> ${calib_kg_known}
      - median:
          window_size: 5
          send_every: 2
          send_first_at: 1
    on_value:
      then:
        - lambda: |-
            // Sobald ein gültiger HX711-Wert ankommt, markieren wir readiness
            id(scale_ready) = true;
        - logger.log: "HX711 ready: gefilterter Wert empfangen"

  - platform: template
    id: scale_total_kg
    name: "${friendly_name} Gesamtgewicht"
    unit_of_measurement: "kg"
    accuracy_decimals: 2
    device_class: weight
    state_class: measurement
    update_interval: never
    force_update: true
    report: force
    filters:
      - round: 2

  - platform: max17043
    id: battery_gauge
    i2c_id: i2c_bus_main
    address: 0x36
    update_interval: never
    battery_voltage:
      id: battery_voltage_raw
      internal: true
      filters:
        - filter_out: NAN
        - round: 2
      on_value:
        then:
          - lambda: |-
              id(battery_cache_v) = x;
              id(battery_voltage_valid) = true;
    battery_level:
      id: battery_pct_raw
      internal: true
      filters:
        - filter_out: NAN
        - clamp:
            min_value: 0.0
            max_value: 100.0
        - round: 1
      on_value:
        then:
          - lambda: |-
              id(battery_cache_pct) = x;
              id(battery_pct_valid) = true;

  - platform: template
    id: battery_voltage
    name: "${friendly_name} Akkuspannung"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    force_update: true
    report: force
    filters:
      - round: 2

  - platform: template
    id: battery_pct
    name: "${friendly_name} Akkustand"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    force_update: true
    report: force
    filters:
      - round: 1

  - platform: template
    id: gas_weight_kg
    name: "${friendly_name} Gasgewicht"
    unit_of_measurement: "kg"
    accuracy_decimals: 2
    device_class: weight
    state_class: measurement
    update_interval: never
    force_update: true
    report: force
    filters:
      - round: 2

  - platform: template
    id: gas_fill_pct
    name: "${friendly_name} Fuellstand"
    unit_of_measurement: "%"
    accuracy_decimals: 2
    state_class: measurement
    icon: mdi:propane-tank
    update_interval: never
    force_update: true
    report: force
    filters:
      - round: 2

interval:
  - interval: 30s
    then:
      - script.execute: publish_after_zigbee_join
